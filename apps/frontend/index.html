<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="ServiceFlow — High-density field service management system"
    >

    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#121212">

    <script>
    (() => {
      const storageKey = "serviceflow-theme";
      const darkQuery = "(prefers-color-scheme: dark)";
      const themeColors = { light: "#e9f6fd", dark: "#121212" };

      let preference = "system";

      try {
        const stored = window.localStorage.getItem(storageKey);

        if (stored === "system" || stored === "light" || stored === "dark") {
          preference = stored;
        }
      } catch {}

      const isDark =
        preference === "dark" ||
        (preference === "system" && window.matchMedia(darkQuery).matches);
      const theme = isDark ? "dark" : "light";

      document.documentElement.classList.toggle("dark", isDark);
      document.documentElement.style.colorScheme = theme;

      document
        .querySelector('meta[name="theme-color"]')
        ?.setAttribute("content", themeColors[theme]);
    })();
    </script>

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/logo.v1.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">

    <title>ServiceFlow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
